name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: typecheck · test · meta · drift · fuzz · tokens · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # The README's "Tests passing" row is maintained by hand and nothing compared it to the suite, so it sat at
      # 1,439 while the suite was at 2,167 (2026-09-30). `pipefail` matters: without it `tee` would swallow a
      # failing suite and the check below would be measuring a run nobody looked at.
      - name: pnpm test, and the README's counts match it
        run: |
          set -o pipefail
          pnpm test | tee /tmp/pnpm-test.log
          node scripts/check-test-counts.mjs --from /tmp/pnpm-test.log
      # Component metadata, maturity criteria and deprecation records (GOVERNANCE.md §5, §7)
      - run: pnpm check:meta
      # The drift gate: the docs app, which stands in for the reference product, must stay on-system (BRIEF §9)
      - run: pnpm drift apps/docs --min-score 95
      # Docs styles that restyle a Syntara component must outweigh it, or stylesheet order decides the layout
      - run: node scripts/check-override-weight.mjs
      - run: pnpm test:themes
      - run: pnpm tokens
      - run: pnpm build
      # Prerendered docs pages must have a selected tab in every tab list, or hydration fails
      - run: node scripts/check-ssr-tabs.mjs

      # React only reports a hydration mismatch in a browser, as it hydrates, and a production build says no more
      # than "Minified React error #418". Reading the HTML cannot find it, so the check drives the real site.
      - run: npx playwright install --with-deps chromium
      - name: Prerendered docs pages must hydrate
        run: |
          pnpm --filter @syntara/docs start &
          for _ in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000/ && break; sleep 2; done
          node scripts/check-hydration.mjs
      # /themes keeps its state in the address and reads it on the client, so shared links are easy to break
      - run: node scripts/check-theme-links.mjs
      # CONVENTIONS.md requires 320px; a page that scrolls sideways there looks fine until someone is on a phone
      - run: node scripts/check-narrow-overflow.mjs
      # Nothing else applies apps/docs/public/_headers, so a CSP that breaks a page reaches production unseen
      - run: node scripts/check-csp.mjs

      - name: Upload theme reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: theme-reports
          path: packages/theme-engine/reports
          if-no-files-found: warn

  # The two browser sweeps that stand behind the accessibility claim a PR makes. They need a built, served site, so
  # they run as their own job beside `verify` rather than inside it.
  #
  # First run on a runner (36595744517): this job 16.4 min, `verify` 11.8 min, started together. So a PR's wait went
  # from about twelve minutes to about sixteen — beside `verify` is cheaper than inside it, but it is not free, and
  # this job is the critical path now. Locally, 113 routes × light and dark: axe-sweep 9m04s, check-overlay-exit
  # 1m52s, docs build 27s. The 45-minute ceiling leaves room for a slower runner.
  a11y:
    name: axe · overlay exit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      # pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps chromium

      # Every workspace package resolves to its own source ("exports" points at src/), so the docs export is the
      # only thing that has to be built here.
      - run: pnpm --filter @syntara/docs build

      # `pnpm --filter @syntara/docs start` is `serve out -l 3000`, and serve falls back to a random port when 3000
      # is taken, prints the port it actually took, and still exits 0. So the port is read from serve's own output
      # rather than assumed. Both scripts then assert the served build id (scripts/served-build.mjs), which is what
      # proves they measured this build and not another server.
      - name: Serve the export
        run: |
          pnpm --filter @syntara/docs start > /tmp/serve.log 2>&1 &
          echo $! > /tmp/serve.pid
          for _ in $(seq 1 60); do grep -qE 'http://localhost:[0-9]+' /tmp/serve.log && break; sleep 1; done
          port="$(grep -oE 'http://localhost:[0-9]+' /tmp/serve.log | head -1 | sed 's#.*:##')"
          if [ -z "$port" ]; then echo 'serve never reported a port:'; cat /tmp/serve.log; exit 1; fi
          cat /tmp/serve.log
          echo "SYNTARA_BASE_URL=http://localhost:$port" >> "$GITHUB_ENV"

      # WCAG 2.2 AA over every docs route in light and dark. Fails on a violation node, and on a route it could not
      # measure (load-failed, pageerror, not-hydrated), so an unmeasured route cannot read as a clean one.
      - name: Every docs route passes axe, light and dark
        run: node scripts/axe-sweep.mjs

      # Overlays must unmount when they close. jsdom has no Web Animations API, so only a real browser shows this.
      - name: Overlays unmount when they close
        run: node scripts/check-overlay-exit.mjs
