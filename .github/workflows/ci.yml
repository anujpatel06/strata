name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: typecheck · test · meta · drift · fuzz · tokens · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # Component metadata, maturity criteria and deprecation records (GOVERNANCE.md §5, §7)
      - run: pnpm check:meta
      # The drift gate: the docs app, which stands in for the reference product, must stay on-system (BRIEF §9)
      - run: pnpm drift apps/docs --min-score 95
      # Docs styles that restyle a Strata component must outweigh it, or stylesheet order decides the layout
      - run: node scripts/check-override-weight.mjs
      - run: pnpm test:themes
      - run: pnpm tokens
      - run: pnpm build
      # Prerendered docs pages must have a selected tab in every tab list, or hydration fails
      - run: node scripts/check-ssr-tabs.mjs

      - name: Upload theme reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: theme-reports
          path: packages/theme-engine/reports
          if-no-files-found: warn
